[project]
name = "ahc-ml"
version = "0.1.0"
description = "Tools for training PyTorch models and deploying them in AtCoder Heuristic Contests"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.2.6",
    "torch==2.8.0",
]

[dependency-groups]
train = [
    "torchview==0.2.7",
    "torchvision==0.23.0",
    "wandb>=0.21,<1",
]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]

[tool.uv]
default-groups = ["dev", "train"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
